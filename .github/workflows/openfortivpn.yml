name: openfortivpn

on:
  push:
    branches:
      - master
      - main
    paths:
      - "openfortivpn/**"
      - ".github/workflows/openfortivpn.yml"
  pull_request:
    paths:
      - "openfortivpn/**"
      - ".github/workflows/openfortivpn.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: openfortivpn
  # Defaults to paperbenni, override with a DOCKERHUB_USERNAME secret.
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || 'paperbenni' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./openfortivpn
          file: ./openfortivpn/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
